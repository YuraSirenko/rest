<!-- rest_app_3_template/templates/flight_detail.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Flight Detail</title>
</head>
<body>
    <h1>Flight Detail</h1>
    <p>ID: {{ flight.id }}</p>
    <p>Flight Number: {{ flight.flight_number }}</p>
    <p>Departure Time: {{ flight.departure_time }}</p>
    <p>Arrival Time: {{ flight.arrival_time }}</p>
    <p>Airplane: {{ flight.airplane }}</p>
    <p>Route: {{ flight.route }}</p>
    <h2>Update Flight</h2>
    <form action="{% url 'rest_app_3_template:flight-detail' flight.id %}" method="post">
        {% csrf_token %}
        <input type="text" name="flight_number" value="{{ flight.flight_number }}">
        <input type="datetime-local" name="departure_time" value="{{ flight.departure_time|date:'Y-m-d\\TH:i' }}">
        <input type="datetime-local" name="arrival_time" value="{{ flight.arrival_time|date:'Y-m-d\\TH:i' }}">
        <input type="text" name="airplane" value="{{ flight.airplane.id }}">
        <input type="text" name="route" value="{{ flight.route.id }}">
        <button type="submit">Update</button>
    </form>
    <h2>Delete Flight</h2>
    <form action="{% url 'rest_app_3_template:flight-delete' flight.id %}" method="post" onsubmit="return confirm('Are you sure you want to delete this flight?');">
        {% csrf_token %}
        <button type="submit">Delete</button>
    </form>
</body>
</html>
