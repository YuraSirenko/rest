<!DOCTYPE html>
<html>
<head>
    <title>Manage Waiters</title>
</head>
<body>
    <h2>Manage Waiters for Order {{ order.id }}</h2>
    <form method="post">
        {% csrf_token %}
        <label for="waiter">Add Waiter:</label>
        <select name="waiter" id="waiter">
            {% for waiter in waiters %}
                <option value="{{ waiter.id }}">{{ waiter.first_name }} {{ waiter.last_name }}</option>
            {% endfor %}
        </select>
        <button type="submit">Add Waiter</button>
    </form>
    <h3>Current Waiters:</h3>
    <ul>
        {% for waiter in order.waiters.all %}
            <li>
                {{ waiter.first_name }} {{ waiter.last_name }}
                <form method="post" action="{% url 'rest_app_3_template:remove_waiter' order.id waiter.id %}" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit">Remove</button>
                </form>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
