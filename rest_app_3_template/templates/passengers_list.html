<!-- templates/passengers_list.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Passengers List</title>
</head>
<body>
    <h1>Passengers List</h1>
    <ul>
        {% for passenger in passengers %}
            <li>{{ passenger.name }} - {{ passenger.email }} - {{ passenger.passport_number }}</li>
        {% endfor %}
    </ul>
    <form method="post" action="{% url 'rest_app_3_template:passenger-list' %}">
        {% csrf_token %}
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <label for="passport_number">Passport Number:</label>
        <input type="text" id="passport_number" name="passport_number" required>
        <button type="submit">Add Passenger</button>
    </form>
</body>
</html>
